<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#006c35">
  <meta name="description" content="رفيقي: مهامك وفلوسك والطقس وأوقات الصلاة في مكان واحد">
  <title>رفيقي</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="رفيقي - الرئيسية"><span class="logo" aria-hidden="true">ر</span> رفيقي</a>
    <nav id="nav" class="nav" aria-label="التنقل الرئيسي"></nav>
    <div class="tools">
      <button id="paletteBtn" class="icon-btn" type="button" aria-label="لوحة الأوامر (Ctrl+K)" title="لوحة الأوامر (Ctrl+K)">⌘</button>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="تبديل الثيم">🌙</button>
    </div>
  </header>

  <main id="app" class="page" tabindex="-1"></main>
  <noscript><p class="banner bad">رفيقي يحتاج JavaScript عشان يشتغل.</p></noscript>

  <dialog id="palette" class="dlg palette" aria-label="لوحة الأوامر">
    <input id="palInput" type="text" placeholder="اكتب أمر... (مثال: مهمة، فلوس، ثيم)" aria-label="ابحث عن أمر" autocomplete="off">
    <ul id="palList" role="listbox"></ul>
  </dialog>

  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/money.js"></script>
  <script src="js/views/weather.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
